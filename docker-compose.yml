services:

  postgres:
    image: postgres:16-alpine
    container_name: wildtracker-postgres
    environment:
      POSTGRES_DB: wildtracker
      POSTGRES_USER: wildtracker
      POSTGRES_PASSWORD: wildtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildtracker -d wildtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: wildtracker-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=wildtracker;
        Username=wildtracker;Password=wildtracker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wildtracker-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
