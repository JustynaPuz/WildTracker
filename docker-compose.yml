services:

  postgres:
    image: postgres:16-alpine
    container_name: wildtracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wildtracker}
      POSTGRES_USER: ${POSTGRES_USER:-wildtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildtracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wildtracker} -d ${POSTGRES_DB:-wildtracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: wildtracker-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB:-wildtracker};
        Username=${POSTGRES_USER:-wildtracker};
        Password=${POSTGRES_PASSWORD:-wildtracker}
      Jwt__Secret: "CHANGE_ME_use_a_strong_secret_at_least_32_chars!!"
      Jwt__Issuer: WildTracker
      Jwt__Audience: WildTracker
      Jwt__ExpiryMinutes: "60"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wildtracker-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
